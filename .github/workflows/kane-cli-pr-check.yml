name: kane-cli-pr check

# On-demand check of integrations/github-action/kane-cli-pr: installs the action's
# dependencies on a clean runner and runs its unit tests (node:test), which cover the
# conversation, impact, run, report and comment rendering against fakes of GitHub and
# kane-cli, plus the shipped example workflow and config. Needs no secrets.

on:
  workflow_dispatch:
    inputs:
      node-version:
        description: "Node.js version to run the tests on (20 or newer)"
        required: false
        default: "24"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: integrations/github-action/kane-cli-pr
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm test
