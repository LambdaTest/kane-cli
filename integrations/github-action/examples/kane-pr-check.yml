# Save as .github/workflows/kane.yml in your repo
name: Kane browser check

on:
  pull_request:

jobs:
  verify-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Optional: build and start your app, or use your preview deployment URL below
      # - run: npm ci && npm run build && npm start &

      - name: Verify checkout flow
        uses: testmuai/kane-action@v1
        with:
          objective: "go to /cart, click Checkout, assert page contains 'Order Summary'"
          url: ${{ github.event.deployment_status.target_url || 'https://staging.myapp.com' }}
          username: ${{ secrets.LT_USERNAME }}
          access-key: ${{ secrets.LT_ACCESS_KEY }}
