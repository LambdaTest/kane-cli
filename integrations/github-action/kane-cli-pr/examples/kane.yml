# Copy to .github/workflows/kane.yml.
#
# kane-cli on pull requests: a reviewer comments `@kane-cli …` on a PR, and kane answers in one
# comment: which tests the change affects, a run of them against the PR's own build, the evidence
# pack and the policy verdict, plus the checks `kane-cli / tests` and `kane-cli / policy`.
#
# Needs the LT_USERNAME and LT_ACCESS_KEY repository secrets, and .github/kane-cli.yml on the
# default branch. The PR's code runs on the runner (its app is started from the PR checkout), so
# keep "Run workflows from fork pull requests" off for private repositories: see the README's
# Security section.
name: kane-cli

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: write

jobs:
  kane:
    # Bot comments and comments without the trigger word never start a job, so they can't take
    # the one waiting slot a person's comment needs (contains() is case-insensitive).
    # The word here must match the action's `mention` input (default @kane-cli).
    if: github.event.comment.user.type != 'Bot' && contains(github.event.comment.body, '@kane-cli')
    # One kane job per PR at a time; a second comment waits for the first to finish.
    concurrency:
      group: kane-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The default branch, by name: the policy files named in .github/kane-cli.yml are read from
      # here. Without the ref, pull_request_review_comment checks out the PR's merge ref, which
      # would let a PR bring its own policy.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # The PR head, for impact and runs: its .testmuai/tests/*_test.md and its app.
      # fetch-depth 0 brings the base commit, so each test splits into impacted / new in this PR.
      - name: Check out the PR head
        if: github.event.issue.pull_request || github.event.pull_request
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number || github.event.pull_request.number }}/head
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: kane-cli
        id: kane
        uses: LambdaTest/kane-cli/integrations/github-action/kane-cli-pr@main
        with:
          phase: run
          username: ${{ secrets.LT_USERNAME }}
          access-key: ${{ secrets.LT_ACCESS_KEY }}
          pr-path: pr

      # The pack goes up before the result is posted, so the result can link to it.
      - name: Upload the evidence pack
        id: evidence
        if: always() && steps.kane.outputs.evidence-path != ''
        uses: actions/upload-artifact@v4
        with:
          name: kane-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.kane.outputs.evidence-path }}
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload kane-cli's run log
        if: always() && steps.kane.outputs.logs-path != ''
        uses: actions/upload-artifact@v4
        with:
          name: kane-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.kane.outputs.logs-path }}
          if-no-files-found: ignore
          retention-days: 30

      - name: kane-cli report
        if: always()
        uses: LambdaTest/kane-cli/integrations/github-action/kane-cli-pr@main
        with:
          phase: report
          username: ${{ secrets.LT_USERNAME }}
          access-key: ${{ secrets.LT_ACCESS_KEY }}
          artifact-id: ${{ steps.evidence.outputs.artifact-id }}
