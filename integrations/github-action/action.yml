name: "Kane CLI Test"
description: "Run plain English browser tests with Kane CLI. Inline objective or test.md suites. Pass/fail verdict, sealed evidence, PR comment."
author: "TestMu AI"
branding:
  icon: "check-circle"
  color: "green"

inputs:
  objective:
    description: "Plain English test objective, e.g. 'go to /cart, click Checkout, assert page contains Order Summary'. Use this OR test-files."
    required: false
  test-files:
    description: "Glob pattern of Kane test.md files to run, e.g. 'tests/**/*_test.md'. Runs every matching file. Use this OR objective."
    required: false
  url:
    description: "Base URL of the app under test (staging/preview URL)"
    required: true
  username:
    description: "TestMu username (pass from secrets.LT_USERNAME)"
    required: true
  access-key:
    description: "TestMu access key (pass from secrets.LT_ACCESS_KEY)"
    required: true
  timeout:
    description: "Max seconds per test run"
    required: false
    default: "300"
  comment-on-pr:
    description: "Post a pass/fail comment with evidence on the PR (true/false)"
    required: false
    default: "true"
  kane-version:
    description: "Version of @testmuai/kane-cli to install"
    required: false
    default: "latest"

outputs:
  status:
    description: "passed | failed"
    value: ${{ steps.run.outputs.status }}
  summary:
    description: "One-line result summary"
    value: ${{ steps.run.outputs.summary }}
  total:
    description: "Number of tests executed"
    value: ${{ steps.run.outputs.total }}
  failed:
    description: "Number of failed tests"
    value: ${{ steps.run.outputs.failed }}

runs:
  using: "composite"
  steps:
    - name: Validate inputs
      shell: bash
      run: |
        if [ -z "${{ inputs.objective }}" ] && [ -z "${{ inputs.test-files }}" ]; then
          echo "::error::Provide either 'objective' (inline test) or 'test-files' (glob of test.md files)."
          exit 1
        fi

    - name: Install Kane CLI
      shell: bash
      run: npm install -g @testmuai/kane-cli@${{ inputs.kane-version }}

    - name: Authenticate
      shell: bash
      run: kane-cli login --username "${{ inputs.username }}" --access-key "${{ inputs.access-key }}"

    - name: Run Kane tests
      id: run
      shell: bash
      run: |
        run_one() {
          # $1 = label, $2... = kane-cli run args
          local label="$1"; shift
          set +e
          kane-cli run "$@" \
            --url "${{ inputs.url }}" \
            --headless --agent \
            --timeout ${{ inputs.timeout }} 2>>kane-stderr.log | tee "kane-stream-$TOTAL.ndjson"
          local rc=${PIPESTATUS[0]}
          set -e
          local run_end
          run_end=$(grep '"type":[[:space:]]*"run_end"' "kane-stream-$TOTAL.ndjson" | tail -1 || echo '{}')
          local st dur
          st=$(echo "$run_end" | jq -r '.status // "unknown"')
          dur=$(echo "$run_end" | jq -r '.duration // 0')
          if [ $rc -ne 0 ] || [ "$st" != "passed" ]; then
            FAILED=$((FAILED+1)); ICON="x"
          else
            ICON="white_check_mark"
          fi
          echo "| \`$label\` | :$ICON: $st | ${dur}s |" >> kane-results.md
          local sdir
          sdir=$(echo "$run_end" | jq -r '.session_dir // ""')
          sdir="${sdir/#\~/$HOME}"
          if [ -n "$sdir" ] && [ -d "$sdir" ]; then
            mkdir -p "kane-evidence/$TOTAL" && cp -r "$sdir"/. "kane-evidence/$TOTAL/"
          fi
        }

        TOTAL=0
        FAILED=0
        echo "| Test | Status | Duration |" > kane-results.md
        echo "|---|---|---|" >> kane-results.md

        if [ -n "${{ inputs.test-files }}" ]; then
          shopt -s globstar nullglob
          MATCHED=0
          for f in ${{ inputs.test-files }}; do
            MATCHED=1
            TOTAL=$((TOTAL+1))
            run_one "$f" --file "$f"
          done
          if [ "$MATCHED" -eq 0 ]; then
            echo "::error::No files matched pattern: ${{ inputs.test-files }}"
            exit 1
          fi
        else
          TOTAL=$((TOTAL+1))
          run_one "inline objective" "${{ inputs.objective }}"
        fi

        PASSED=$((TOTAL-FAILED))
        if [ "$FAILED" -eq 0 ]; then STATUS="passed"; else STATUS="failed"; fi
        echo "status=$STATUS" >> "$GITHUB_OUTPUT"
        echo "summary=$PASSED/$TOTAL tests passed" >> "$GITHUB_OUTPUT"
        echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
        echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
        if [ -d ".testmuai/evidence" ] && [ ! -d "kane-evidence" ]; then
          mkdir -p kane-evidence && cp -r .testmuai/evidence/. kane-evidence/
        fi
        [ "$FAILED" -eq 0 ]

    - name: Upload evidence artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: kane-evidence-${{ github.run_id }}
        path: |
          kane-evidence/
          kane-stream-*.ndjson
          kane-results.md
        if-no-files-found: ignore
        retention-days: 30

    - name: Comment on PR
      if: always() && inputs.comment-on-pr == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      env:
        KANE_STATUS: ${{ steps.run.outputs.status }}
        KANE_SUMMARY: ${{ steps.run.outputs.summary }}
      with:
        script: |
          const fs = require('fs');
          const status = process.env.KANE_STATUS;
          const passed = status === 'passed';
          const icon = passed ? ':white_check_mark:' : ':x:';
          let table = '';
          try { table = fs.readFileSync('kane-results.md', 'utf8'); } catch (e) {}
          const artifactUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const body = [
            `## ${icon} Kane CLI: ${status}`,
            ``,
            `> ${process.env.KANE_SUMMARY}`,
            ``,
            table,
            `**Evidence:** download the \`kane-evidence\` artifact from [this run](${artifactUrl})`,
            ``,
            `<sub>Verified in a real browser by [Kane CLI](https://testmuai.com/kane-cli) - screenshots, network traces, and console logs in the evidence pack</sub>`
          ].join('\n');
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body
          });
